name: Test Suite

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            extras: dev
            pytest_args: ./tests --ignore=tests/integrations/garak --ignore=tests/integrations/pyrit
          - name: garak
            extras: dev,garak
            pytest_args: tests/integrations/garak
          - name: pyrit
            extras: dev,pyrit
            pytest_args: tests/integrations/pyrit
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv pip install --system ".[${{ matrix.extras }}]"

      - name: Run tests
        run: pytest ${{ matrix.pytest_args }}
